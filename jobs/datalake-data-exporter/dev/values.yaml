name: "datalake-data-exporter"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-datalake-data-exporter-{{.Values.namespace}}"

configmap:
  DATALAKE_STORAGE_BUCKET: "interop-datalake-exports-{{.Values.namespace}}"

cronjob:
  suspend: false
  schedule: "0 3 * * *"
  concurrencyPolicy: "Forbid"
  activeDeadlineSeconds: null
  env:
    LOG_LEVEL: DEBUG
  envFromConfigmaps:
    SH_DB_HOST: "common-signal-store.DB_HOST_RW"
    SH_DB_NAME: "common-signal-store.DB_NAME"
    SH_DB_PORT: "common-signal-store.DB_PORT"
    SH_DB_SIGNALHUB_SCHEMA: "common-signal-store.DB_SIGNALHUB_SCHEMA"
    SH_DB_INTEROP_SCHEMA: "common-signal-store.DB_INTEROP_SCHEMA"
    SH_DB_USE_SSL: "common-signal-store.DB_USE_SSL"
  envFromSecrets:
    SH_DB_USERNAME: "signal-store-datalake-data-exporter-user.username"
    SH_DB_PASSWORD: "signal-store-datalake-data-exporter-user.password"
